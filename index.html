<script>
const mainSearch = document.getElementById("mainSearch");
const topSearch = document.getElementById("topSearch");

// 🔍 SEARCH (FIXED)
function search(q) {
    if (!q) return;

    // open in SAME tab (clean experience)
    window.location.href = "https://duckduckgo.com/?q=" + encodeURIComponent(q);
}

// ENTER EVENTS
mainSearch.addEventListener("keypress", e => {
    if (e.key === "Enter") search(mainSearch.value);
});

topSearch.addEventListener("keypress", e => {
    if (e.key === "Enter") search(topSearch.value);
});


// 🤖 AI BOT (UPGRADED)
const botInput = document.getElementById("botInput");
const messages = document.getElementById("messages");

function botReply(msg) {
    msg = msg.toLowerCase();

    // greetings
    if (msg.includes("hi") || msg.includes("hello"))
        return "yo 👋 I'm Sidekick";

    // identity
    if (msg.includes("who are you"))
        return "I'm your Proton AI assistant 🤖";

    // time
    if (msg.includes("time"))
        return new Date().toLocaleTimeString();

    // jokes
    if (msg.includes("joke")) {
        const jokes = [
            "too many tabs crashed me 💀",
            "i told my cpu a joke… now it's processing 😂",
            "404 joke not found 😭"
        ];
        return jokes[Math.floor(Math.random() * jokes.length)];
    }

    // math
    if (msg.match(/[\+\-\*\/]/)) {
        try { return eval(msg); } catch { return "math error 🤔"; }
    }

    // help
    if (msg.includes("help"))
        return "try: time, joke, math, or 'who are you' 💡";

    return "interesting… tell me more 🤖";
}

// CHAT SYSTEM
botInput.addEventListener("keypress", e => {
    if (e.key === "Enter") {
        let msg = botInput.value;

        messages.innerHTML += `<p>You: ${msg}</p>`;
        messages.innerHTML += `<p>Bot: ${botReply(msg)}</p>`;

        botInput.value = "";
        messages.scrollTop = messages.scrollHeight;
    }
});
</script>
